[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-safety-crew"
version = "0.2.0"
description = "Offline evidence coordination for authorized community cybersecurity assessments"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.scripts]
csc = "cyber_safety_crew.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
